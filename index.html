<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Väder & Meteorologi – Instuderingsfrågor åk 5</title>
<style>
  :root {
    --blue: #2F6FE3;
    --blue-dark: #1E4FB0;
    --blue-light: #EAF1FF;
    --green: #2FAE60;
    --green-light: #E7F8ED;
    --red: #E3542F;
    --red-light: #FDEDE8;
    --amber: #E3A62F;
    --amber-light: #FDF4E3;
    --ink: #1B2430;
    --ink-soft: #5B6675;
    --bg: #F4F7FC;
    --card: #FFFFFF;
    --border: #E1E8F4;
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181F;
      --card: #1C222D;
      --border: #2A3240;
      --ink: #EDF1F7;
      --ink-soft: #9AA6B6;
      --blue-light: #1D2A44;
      --green-light: #16301F;
      --red-light: #3A1E17;
      --amber-light: #372A10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181F;
    --card: #1C222D;
    --border: #2A3240;
    --ink: #EDF1F7;
    --ink-soft: #9AA6B6;
    --blue-light: #1D2A44;
    --green-light: #16301F;
    --red-light: #3A1E17;
    --amber-light: #372A10;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding: 10px 0 14px;
    z-index: 5;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .emoji-badge {
    font-size: 30px;
    line-height: 1;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    line-height: 1.25;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 2px;
  }
  .progress-track {
    margin-top: 14px;
    height: 8px;
    border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), #5B96FF);
    border-radius: 99px;
    transition: width .35s ease;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 1px 2px rgba(20,30,50,0.04);
  }

  .section-tag {
    display: inline-block;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 14px;
  }

  .question-text {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;
    margin: 0 0 18px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    text-align: left;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--blue); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct {
    border-color: var(--green);
    background: var(--green-light);
    font-weight: 600;
  }
  .option-btn.incorrect {
    border-color: var(--red);
    background: var(--red-light);
  }

  textarea.answer-box {
    width: 100%;
    min-height: 84px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    color: var(--ink);
  }
  textarea.answer-box:focus { outline: none; border-color: var(--blue); }

  .btn {
    appearance: none;
    border: none;
    border-radius: 14px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
  }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-primary:disabled { background: var(--border); color: var(--ink-soft); cursor: default; }
  .btn-ghost {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--ink);
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn-row .btn { flex: 1; min-width: 120px; }

  .facit-box {
    margin-top: 16px;
    background: var(--blue-light);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .facit-box b { color: var(--blue-dark); }

  .self-check-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .self-check-row .btn { flex: 1; }
  .btn-right {
    background: var(--green-light);
    border: 1.5px solid var(--green);
    color: var(--green);
  }
  .btn-wrong {
    background: var(--red-light);
    border: 1.5px solid var(--red);
    color: var(--red);
  }

  .feedback-banner {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14.5px;
  }
  .feedback-banner.correct { background: var(--green-light); color: var(--green); }
  .feedback-banner.incorrect { background: var(--red-light); color: var(--red); }

  .explanation {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .hint-btn {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
  }
  .hint-box {
    background: var(--amber-light);
    color: #8B5E00;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-bottom: 14px;
    display: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .hint-box { color: #E3B84F; }
  }
  :root[data-theme="dark"] .hint-box { color: #E3B84F; }

  .center-card {
    text-align: center;
    padding: 40px 24px;
  }
  .big-emoji { font-size: 52px; margin-bottom: 8px; }
  .center-card h2 { font-size: 22px; margin: 6px 0 10px; }
  .center-card p { color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; margin-bottom: 22px; }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--blue-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    margin: 0 auto 20px;
  }
  .score-circle .num { font-size: 34px; font-weight: 800; color: var(--blue-dark); }
  .score-circle .lbl { font-size: 12px; color: var(--ink-soft); }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 18px 0 24px;
    text-align: left;
  }
  .category-pill {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .category-pill .catname { font-weight: 700; display: block; margin-bottom: 3px; }
  .category-pill .catscore { color: var(--ink-soft); }

  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filter-chip {
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 99px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-chip.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  footer.note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 26px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Frågebank ---------- */
/* Rättad mot bokens faktiska text (s. 19-27). Enklare språk för åk 5. */
/* type: "mc" (flervalsfråga) eller "open" (eget svar, självrättning) */
const QUESTIONS = [
  // 1. Meteorologi
  { id: 1, cat: "Meteorologi", type: "mc",
    q: "Vad handlar meteorologi om?",
    options: ["Rymden och planeterna", "Luften och vädret", "Havens djur", "Jordens inre"],
    correct: 1,
    explain: "Inom meteorologi studerar man atmosfären, till exempel lufttryck, temperatur, vind och fukt i luften." },
  { id: 2, cat: "Meteorologi", type: "open",
    q: "Nämn tre saker man mäter i luften för att veta hur vädret blir.",
    model: "T.ex. lufttryck, temperatur, vind och fuktighet i luften (välj tre av dessa).",
    hint: "Det står i första stycket i boken." },

  // 2. Lufttryck
  { id: 3, cat: "Lufttryck", type: "mc",
    q: "Vad är lufttryck?",
    options: ["Hur varmt det är ute", "Hur mycket luften trycker mot saker", "Hur fort vinden blåser", "Hur mycket det regnar"],
    correct: 1,
    explain: "Lufttryck är hur mycket luftmolekylerna trycker mot allt som har luft omkring sig." },
  { id: 4, cat: "Lufttryck", type: "mc",
    q: "Vad heter instrumentet man mäter lufttryck med?",
    options: ["Termometer", "Anemometer", "Barometer", "Regnmätare"],
    correct: 2,
    explain: "En barometer mäter lufttrycket. Lufttryck mäts i hektopascal (hPa)." },
  { id: 5, cat: "Lufttryck", type: "open",
    q: "Vad är normalt lufttryck, mätt i hPa?",
    model: "Normalt lufttryck är 1013 hPa.",
    hint: "Siffran finns i stycket 'Mäta lufttrycket'." },
  { id: 6, cat: "Lufttryck", type: "open",
    q: "Varför gör det ofta ont i öronen när man flyger eller åker upp på ett högt berg?",
    model: "Högre upp är lufttrycket lägre. Det gör att trumhinnorna trycks in lite, vilket kan kännas obehagligt.",
    hint: "Vad händer med lufttrycket ju högre upp man kommer?" },
  { id: 7, cat: "Lufttryck", type: "mc",
    q: "Vad kallas ett område där luftmolekylerna sitter tätt ihop?",
    options: ["Lågtryck (L)", "Högtryck (H)", "Vindtryck", "Molntryck"],
    correct: 1,
    explain: "Många molekyler tätt ihop = hög densitet = högtryck (H). Färre molekyler = lågtryck (L)." },

  // 3. Vindar
  { id: 8, cat: "Vindar", type: "mc",
    q: "Vad är det som gör att vind uppstår?",
    options: ["Skillnader i lufttryck", "Att jorden snurrar snabbt", "Att molnen rör sig", "Regn som faller"],
    correct: 0,
    explain: "Luft rör sig från högre lufttryck mot lägre lufttryck. Det gör att det blåser." },
  { id: 9, cat: "Vindar", type: "mc",
    q: "Vad kallas effekten som gör att vindar böjer av, på grund av jordens rotation?",
    options: ["Corioliseffekten", "Gravitationseffekten", "Vindeffekten", "Tryckeffekten"],
    correct: 0,
    explain: "Corioliseffekten böjer av vindarna åt höger på norra halvklotet och åt vänster på södra halvklotet." },
  { id: 10, cat: "Vindar", type: "mc",
    q: "Vad mäter man vindens hastighet med?",
    options: ["Barometer", "Anemometer", "Termometer", "Hygrometer"],
    correct: 1,
    explain: "En anemometer (vindsnurra) mäter vindens hastighet, i meter per sekund (m/s)." },
  { id: 11, cat: "Vindar", type: "open",
    q: "Förklara skillnaden mellan sjöbris och landbris. Vilken blåser på dagen och vilken på kvällen/natten?",
    model: "Sjöbris blåser in mot land på dagen. Landbris blåser ut mot havet på kvällen/natten, och är oftast svagare.",
    hint: "En kommer från havet, en går mot havet." },
  { id: 12, cat: "Vindar", type: "mc",
    q: "Titta i tabellen: Vad kallas en vind på 8–14 m/s?",
    options: ["Svag vind", "Måttlig vind", "Frisk vind", "Storm"],
    correct: 2,
    explain: "8–14 m/s kallas frisk vind. Då syns 'vita gäss' (skum) på vågorna." },

  // 4. Moln
  { id: 13, cat: "Moln", type: "mc",
    q: "Hur bildas moln?",
    options: ["Sand virvlar upp i luften", "Vatten i luften kyls ner och blir droppar eller iskristaller", "Solen värmer marken", "Lufttrycket blir exakt 1013 hPa"],
    correct: 1,
    explain: "Moln bildas när vatten i luften kyls ner så att det går från gasform till flytande eller fast form." },
  { id: 14, cat: "Moln", type: "mc",
    q: "Stackmoln kallas också för ett annat namn. Vilket?",
    options: ["Cumulonimbus-moln", "Cirrus-moln", "Cumulus-moln", "Stratus-moln"],
    correct: 2,
    explain: "Stackmoln kallas också cumulus-moln, och ibland 'vackertvädermoln'." },
  { id: 15, cat: "Moln", type: "mc",
    q: "Vilken sorts moln ger ofta regn, åska och hagel?",
    options: ["Stackmoln", "Bymoln", "Dimma", "Vackertvädermoln"],
    correct: 1,
    explain: "Bymoln är stora, grå och mycket tjocka och ger ofta regn, åska, hagel, snö och ibland tromber." },
  { id: 16, cat: "Moln", type: "open",
    q: "Vad är en tromb?",
    model: "En tromb är en kraftig virvelvind.",
    hint: "Det står i stycket om bymoln." },

  // 5. Nederbörd
  { id: 17, cat: "Nederbörd", type: "mc",
    q: "I vilken enhet mäter man nederbörd?",
    options: ["Liter", "Centimeter", "Millimeter", "Gram"],
    correct: 2,
    explain: "Nederbörd mäts i millimeter (mm) – hur högt vattnet står i en burk." },
  { id: 18, cat: "Nederbörd", type: "open",
    q: "Hur bildas hagel? Berätta kort med egna ord.",
    model: "Regndroppar fryser till is i luften och far upp och ner i molnet flera gånger, tills de blir så stora att de faller ner som iskulor.",
    hint: "Läs stycket 'Regn, snö eller hagel?' i boken." },
  { id: 19, cat: "Nederbörd", type: "open",
    q: "Varför kan det bli väldigt kallt på natten i en öken, fast det är mycket varmt på dagen?",
    model: "I öknen finns det för lite fukt i luften för att bilda moln. Utan moln som täcke kyls marken av snabbt på natten.",
    hint: "Vad gör moln normalt på natten?" },

  // 6. Väderprognoser
  { id: 20, cat: "Väderprognoser", type: "mc",
    q: "Vad heter myndigheten i Sverige som gör väderprognoser?",
    options: ["SMHI", "SVT", "SCB", "SGU"],
    correct: 0,
    explain: "SMHI står för Sveriges meteorologiska och hydrologiska institut." },
];

/* ---------- App-state ---------- */
const CATEGORIES = [...new Set(QUESTIONS.map(q => q.cat))];
let state = {
  screen: "start",
  filterCat: "Alla",
  pool: [],
  index: 0,
  answers: {},
  answered: false,
  selectedOption: null,
  hintShown: false,
};

function buildPool() {
  const list = state.filterCat === "Alla" ? QUESTIONS : QUESTIONS.filter(q => q.cat === state.filterCat);
  state.pool = shuffle([...list]);
  state.index = 0;
  state.answers = {};
  state.answered = false;
  state.selectedOption = null;
  state.hintShown = false;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "start") app.innerHTML = renderStart();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else app.innerHTML = renderResult();
  attachHandlers();
}

function renderStart() {
  const chips = ["Alla", ...CATEGORIES].map(c =>
    `<button class="filter-chip ${state.filterCat === c ? 'active' : ''}" data-cat="${c}">${c}</button>`
  ).join("");
  const count = state.filterCat === "Alla" ? QUESTIONS.length : QUESTIONS.filter(q => q.cat === state.filterCat).length;
  return `
    <header class="top">
      <div class="title-row">
        <div class="emoji-badge">🌦️</div>
        <div>
          <h1>Väder & Meteorologi</h1>
          <div class="subtitle">Instuderingsfrågor – Fysik, åk 5</div>
        </div>
      </div>
    </header>
    <div class="card center-card">
      <div class="big-emoji">🌤️</div>
      <h2>Redo att öva?</h2>
      <p>Välj ett avsnitt eller kör alla frågor blandat. Vissa frågor är flervalsfrågor, andra svarar du med egna ord – sedan jämför du med facit och avgör själv om du hade rätt. Svaret behöver inte vara ordagrant likadant som i boken!</p>
      <div class="filter-row" style="justify-content:center;">${chips}</div>
      <button class="btn btn-primary" id="start-btn" style="width:100%;">Starta (${count} frågor)</button>
    </div>
    <footer class="note">Baserat på kapitlet om meteorologi, sidorna 19–27.</footer>
  `;
}

function renderQuiz() {
  const q = state.pool[state.index];
  const total = state.pool.length;
  const pct = Math.round((state.index / total) * 100);
  const answeredCount = Object.keys(state.answers).length;

  let bodyHtml = "";
  if (q.type === "mc") {
    bodyHtml = `
      <div class="options">
        ${q.options.map((opt, i) => {
          let cls = "option-btn";
          if (state.answered) {
            if (i === q.correct) cls += " correct";
            else if (i === state.selectedOption) cls += " incorrect";
          }
          return `<button class="${cls}" data-opt="${i}" ${state.answered ? "disabled" : ""}>${opt}</button>`;
        }).join("")}
      </div>
      ${state.answered ? `
        <div class="feedback-banner ${state.selectedOption === q.correct ? 'correct' : 'incorrect'}">
          ${state.selectedOption === q.correct ? "✅ Rätt!" : "❌ Inte riktigt."}
        </div>
        <div class="explanation">${q.explain}</div>
      ` : ""}
    `;
  } else {
    bodyHtml = `
      ${q.hint ? `<button class="hint-btn" id="hint-btn">💡 Visa ledtråd</button>
      <div class="hint-box" id="hint-box">${q.hint}</div>` : ""}
      <textarea class="answer-box" id="open-answer" placeholder="Skriv ditt svar här..." ${state.answered ? "disabled" : ""}></textarea>
      ${!state.answered ? `
        <div class="btn-row">
          <button class="btn btn-primary" id="check-btn" style="flex:1;">Visa facit</button>
        </div>
      ` : `
        <div class="facit-box"><b>Facit:</b> ${q.model}</div>
        ${state.selectedOption === null ? `
          <div class="self-check-row">
            <button class="btn btn-right" id="mark-right">✅ Jag hade rätt</button>
            <button class="btn btn-wrong" id="mark-wrong">❌ Jag missade något</button>
          </div>
        ` : `
          <div class="feedback-banner ${state.selectedOption ? 'correct' : 'incorrect'}">
            ${state.selectedOption ? "Bra jobbat! ✅" : "Ingen fara, nu vet du det till nästa gång. 💪"}
          </div>
        `}
      `}
    `;
  }

  return `
    <header class="top">
      <div class="title-row">
        <div class="emoji-badge">🌦️</div>
        <div>
          <h1>Väder & Meteorologi</h1>
          <div class="subtitle">Fråga ${state.index + 1} av ${total} · ${answeredCount} besvarade</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </header>
    <div class="card">
      <div class="section-tag">${q.cat}</div>
      <p class="question-text">${q.q}</p>
      ${bodyHtml}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="quit-btn">Avsluta</button>
      <button class="btn btn-primary" id="next-btn" ${state.answered ? "" : "disabled"}>${state.index + 1 === total ? "Se resultat" : "Nästa fråga"}</button>
    </div>
  `;
}

function renderResult() {
  const total = state.pool.length;
  const correctCount = Object.values(state.answers).filter(Boolean).length;
  const pct = total ? Math.round((correctCount / total) * 100) : 0;
  let msg = "Bra jobbat!";
  if (pct === 100) msg = "Perfekt! Du kan det här utantill! 🌟";
  else if (pct >= 75) msg = "Riktigt bra jobbat! 🎉";
  else if (pct >= 50) msg = "Bra försök – öva lite till! 💪";
  else msg = "Fortsätt öva, det kommer sitta! 📚";

  const catStats = {};
  state.pool.forEach(q => {
    if (!catStats[q.cat]) catStats[q.cat] = { total: 0, correct: 0 };
    catStats[q.cat].total++;
    if (state.answers[q.id]) catStats[q.cat].correct++;
  });
  const catHtml = Object.entries(catStats).map(([cat, s]) =>
    `<div class="category-pill"><span class="catname">${cat}</span><span class="catscore">${s.correct}/${s.total} rätt</span></div>`
  ).join("");

  return `
    <header class="top">
      <div class="title-row">
        <div class="emoji-badge">🌦️</div>
        <div>
          <h1>Väder & Meteorologi</h1>
          <div class="subtitle">Resultat</div>
        </div>
      </div>
    </header>
    <div class="card center-card">
      <div class="score-circle">
        <div class="num">${correctCount}/${total}</div>
        <div class="lbl">rätt</div>
      </div>
      <h2>${msg}</h2>
      <p>Du klarade ${pct}% av frågorna om ${state.filterCat === "Alla" ? "hela kapitlet" : state.filterCat.toLowerCase()}.</p>
      <div class="category-grid">${catHtml}</div>
      <button class="btn btn-primary" id="retry-btn" style="width:100%; margin-bottom:10px;">Kör igen</button>
      <button class="btn btn-ghost" id="home-btn" style="width:100%;">Tillbaka till start</button>
    </div>
  `;
}

function attachHandlers() {
  if (state.screen === "start") {
    document.querySelectorAll(".filter-chip").forEach(btn => {
      btn.onclick = () => { state.filterCat = btn.dataset.cat; render(); };
    });
    document.getElementById("start-btn").onclick = () => {
      buildPool();
      state.screen = "quiz";
      render();
    };
  } else if (state.screen === "quiz") {
    const q = state.pool[state.index];

    if (q.type === "mc") {
      document.querySelectorAll(".option-btn").forEach(btn => {
        btn.onclick = () => {
          if (state.answered) return;
          const i = parseInt(btn.dataset.opt, 10);
          state.selectedOption = i;
          state.answered = true;
          state.answers[q.id] = (i === q.correct);
          render();
        };
      });
    } else {
      const hintBtn = document.getElementById("hint-btn");
      if (hintBtn) {
        hintBtn.onclick = () => {
          document.getElementById("hint-box").style.display = "block";
          hintBtn.style.display = "none";
        };
      }
      const checkBtn = document.getElementById("check-btn");
      if (checkBtn) {
        checkBtn.onclick = () => {
          state.answered = true;
          state.selectedOption = null;
          render();
        };
      }
      const markRight = document.getElementById("mark-right");
      const markWrong = document.getElementById("mark-wrong");
      if (markRight) markRight.onclick = () => { state.selectedOption = true; state.answers[q.id] = true; render(); };
      if (markWrong) markWrong.onclick = () => { state.selectedOption = false; state.answers[q.id] = false; render(); };
    }

    document.getElementById("quit-btn").onclick = () => {
      state.screen = "start";
      render();
    };
    document.getElementById("next-btn").onclick = () => {
      if (!state.answered) return;
      if (state.index + 1 >= state.pool.length) {
        state.screen = "result";
      } else {
        state.index++;
        state.answered = false;
        state.selectedOption = null;
        state.hintShown = false;
      }
      render();
    };
  } else {
    document.getElementById("retry-btn").onclick = () => {
      buildPool();
      state.screen = "quiz";
      render();
    };
    document.getElementById("home-btn").onclick = () => {
      state.screen = "start";
      render();
    };
  }
}

render();
</script>
</body>
</html>
